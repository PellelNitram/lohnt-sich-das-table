name: Build and deploy

on:
  schedule:
    - cron: "17 4 * * 1" # every Monday, 04:17 UTC
  workflow_dispatch: # manual run, e.g. right after approving new rows
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build site and API
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          FORM_URL: ${{ vars.FORM_URL }}
          BLOG_URL: ${{ vars.BLOG_URL }}
          GOATCOUNTER_URL: ${{ vars.GOATCOUNTER_URL }}
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
